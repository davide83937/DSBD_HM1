apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'datacollector'
        static_configs:
          - targets: ['datacollector-service:9999']

      - job_name: 'usermanager'
        static_configs:
          - targets: [ 'usermanager-service:9999' ]

      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor:8080']