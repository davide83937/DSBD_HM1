apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DB_USER: "anto"
  DB_PASSWORD: "onta"
  CLIENT_ID: "davidepanto@gmail.com-api-client"
  CLIENT_SECRET: "ewpHTQ27KoTGv4vMoCyLT8QrIt4sLr3z"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        resolver 10.96.0.10 valid=30s;

        server {
            listen 80;

            location /user/ {
                rewrite ^/user/(.*) /$1 break;
                set $user_service usermanager-service;
                proxy_pass http://$user_service:5000;
                
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /data/ {
                rewrite ^/data/(.*) /$1 break;
                
                set $data_service datacollector-service;
                proxy_pass http://$data_service:5005;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }