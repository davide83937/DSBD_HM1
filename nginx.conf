events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Cambiato da /user/ a /usermanager/ per corrispondere a Postman
        location /usermanager/ {
            rewrite ^/usermanager/(.*) /$1 break;
            # Usato il nome esatto del servizio Kubernetes
            proxy_pass http://usermanager-service:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Cambiato da /data/ a /datacollector/ (opzionale, ma consigliato per coerenza)
        location /datacollector/ {
            rewrite ^/datacollector/(.*) /$1 break;
            # Usato il nome esatto del servizio Kubernetes
            proxy_pass http://datacollector-service:5005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}